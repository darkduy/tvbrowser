name: Build TV Browser APK

# Chạy khi push lên nhánh main, khi tạo pull request, hoặc kích hoạt thủ công
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cấp quyền thực thi cho gradlew
        run: chmod +x ./gradlew

      # Giải mã keystore từ secret (dạng base64) ra file thật để ký APK.
      # Secret KEYSTORE_BASE64 được tạo bằng lệnh: base64 -w0 keystore.jks
      - name: Giải mã keystore từ secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 đang trống hoặc chưa được khai báo trong repo."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          # Kiểm tra file giải mã ra có phải keystore hợp lệ không (tránh trường hợp
          # base64 sai định dạng tạo ra file rác nhưng bước sau vẫn "chạy được").
          if ! keytool -list -keystore release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" > /dev/null 2>&1; then
            echo "::error::File keystore giải mã từ KEYSTORE_BASE64 không hợp lệ hoặc sai KEYSTORE_PASSWORD."
            exit 1
          fi

      - name: Build APK bản Release (đã ký)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Kiểm tra ngay trong CI rằng APK thực sự được ký bằng keystore release,
      # KHÔNG phải bị Android Gradle Plugin âm thầm fallback sang debug key.
      - name: Xác minh chữ ký APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Không tìm thấy file APK release nào sau khi build."
            exit 1
          fi
          echo "Đang kiểm tra chữ ký của: $APK_PATH"
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          "$APKSIGNER" verify --print-certs "$APK_PATH"
          if "$APKSIGNER" verify --print-certs "$APK_PATH" | grep -qi "CN=Android Debug"; then
            echo "::error::APK đang bị ký bằng DEBUG key thay vì keystore release! Kiểm tra lại secrets KEYSTORE_*."
            exit 1
          fi

      - name: Xóa keystore khỏi runner (bảo mật)
        if: always()
        run: rm -f release.keystore

      - name: Tải APK lên làm artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-browser-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error