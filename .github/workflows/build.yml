name: Build TV Browser APK

# Chạy khi push lên nhánh main, khi tạo pull request, hoặc kích hoạt thủ công
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cấp quyền thực thi cho gradlew
        run: chmod +x ./gradlew

      # Giải mã keystore từ secret (dạng base64) ra file thật để ký APK.
      # Secret KEYSTORE_BASE64 được tạo bằng lệnh: base64 -w0 keystore.jks
      - name: Giải mã keystore từ secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build APK bản Release (đã ký)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Xóa keystore khỏi runner (bảo mật)
        if: always()
        run: rm -f release.keystore

      - name: Tải APK lên làm artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-browser-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
